name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "30 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  codeql:
    name: CodeQL
    runs-on: ubuntu-latest

    steps:
      - name: Obter o código
        uses: actions/checkout@v4

      - name: Inicializar CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: python

      - name: Analisar o código
        uses: github/codeql-action/analyze@v4

  pip-audit:
    name: Auditar dependências Python
    runs-on: ubuntu-latest

    steps:
      - name: Obter o código
        uses: actions/checkout@v4

      - name: Auditar requirements.txt
        uses: pypa/gh-action-pip-audit@v1.1.0
        with:
          inputs: requirements.txt

  bandit:
    name: Analisar código Python
    runs-on: ubuntu-latest

    steps:
      - name: Obter o código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar Bandit
        run: python -m pip install bandit

      - name: Executar análise
        run: bandit -r app -ll

  dependency-review:
    name: Rever dependências alteradas
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Rever alterações
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
